services:
  bd_postgres:
    container_name: bd_postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: mi_base_de_datos
    ports:
      - "5401:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: